<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hacker House Goa • 2026</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Anton&family=DM+Mono:wght@400;500&display=swap');


/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #076b3a;
    color: #fff;
    font-family: "DM Mono", monospace;
}


/* =====================================================
   MAIN SCENE
===================================================== */

.scene {
    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background:
        #076b3a;
}


/* =====================================================
   SUBTLE PAPER / GRAIN EFFECT
===================================================== */

.scene::after {
    content: "";

    position: absolute;

    inset: 0;

    z-index: 50;

    pointer-events: none;

    opacity: 0.08;

    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");
}


/* =====================================================
   IMAGE LAYERS
===================================================== */

.layer {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    object-position: center;

    pointer-events: none;

    user-select: none;

    will-change: transform, opacity;
}


/* =====================================================
   LAYER 1 — BACKGROUND
===================================================== */

.layer1 {
    z-index: 1;

    opacity: 0;

    animation:
        fadeIn 1.2s ease forwards;
}


/* =====================================================
   LAYER 2 — HORIZON
===================================================== */

.layer2 {
    z-index: 5;

    opacity: 0;

    transform:
        translateY(30px)
        scale(1.03);

    animation:
        horizonIn 1.3s
        cubic-bezier(.2,.8,.2,1)
        .35s
        forwards;
}


/* =====================================================
   LAYER 3 — MIDGROUND
===================================================== */

.layer3 {
    z-index: 10;

    opacity: 0;

    transform:
        translateY(60px);

    animation:
        midgroundIn 1.2s
        cubic-bezier(.2,.8,.2,1)
        .7s
        forwards;
}


/* =====================================================
   LAYER 4 — LEFT HOUSE
===================================================== */

.layer4 {
    z-index: 20;

    opacity: 0;

    transform:
        translateX(-100px)
        translateY(30px);

    animation:
        leftHouseIn 1.3s
        cubic-bezier(.16,1,.3,1)
        1s
        forwards;
}


/* =====================================================
   LAYER 5 — RIGHT HOUSE
===================================================== */

.layer5 {
    z-index: 21;

    opacity: 0;

    transform:
        translateX(100px)
        translateY(30px);

    animation:
        rightHouseIn 1.3s
        cubic-bezier(.16,1,.3,1)
        1.15s
        forwards;
}


/* =====================================================
   LAYER 6 — FOREGROUND
===================================================== */

.layer6 {
    z-index: 30;

    opacity: 0;

    transform:
        scale(1.08)
        translateY(80px);

    animation:
        foregroundIn 1.5s
        cubic-bezier(.16,1,.3,1)
        1.3s
        forwards;
}


/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes fadeIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


@keyframes horizonIn {

    from {
        opacity: 0;

        transform:
            translateY(50px)
            scale(1.06);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1.03);
    }
}


@keyframes midgroundIn {

    from {
        opacity: 0;

        transform:
            translateY(80px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}


@keyframes leftHouseIn {

    from {
        opacity: 0;

        transform:
            translateX(-130px)
            translateY(50px);
    }

    to {
        opacity: 1;

        transform:
            translateX(0)
            translateY(0);
    }
}


@keyframes rightHouseIn {

    from {
        opacity: 0;

        transform:
            translateX(130px)
            translateY(50px);
    }

    to {
        opacity: 1;

        transform:
            translateX(0)
            translateY(0);
    }
}


@keyframes foregroundIn {

    from {
        opacity: 0;

        transform:
            scale(1.12)
            translateY(100px);
    }

    to {
        opacity: 1;

        transform:
            scale(1.08)
            translateY(0);
    }
}


/* =====================================================
   TOP LABEL
===================================================== */

.top-label {

    position: absolute;

    top: 25px;
    left: 35px;

    z-index: 60;

    font-size: 13px;

    font-weight: 500;

    letter-spacing: 1px;

    color: #fff;

    opacity: 0;

    animation:
        labelIn .8s ease
        1.8s
        forwards;
}


.top-label span {
    color: #ffd500;
}


/* =====================================================
   TOP RIGHT
===================================================== */

.top-right {

    position: absolute;

    top: 25px;
    right: 35px;

    z-index: 60;

    display: flex;

    gap: 20px;

    align-items: center;

    font-size: 11px;

    opacity: 0;

    animation:
        labelIn .8s ease
        2s
        forwards;
}


.top-right span {
    color: #fff;
}


.top-right .dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #ffd500;

    animation:
        blink 1.5s infinite;
}


@keyframes labelIn {

    from {
        opacity: 0;

        transform:
            translateY(-15px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}


@keyframes blink {

    0%,
    100% {
        opacity: .4;
    }

    50% {
        opacity: 1;
    }
}


/* =====================================================
   CENTER CONTENT
===================================================== */

.content {

    position: absolute;

    z-index: 55;

    left: 50%;
    top: 54%;

    transform:
        translate(-50%, -50%);

    width: 90%;

    text-align: center;

    pointer-events: none;
}


/* =====================================================
   TASK TITLE
===================================================== */

.task {

    font-family: "Anton", Impact, sans-serif;

    font-size:
        clamp(32px, 5vw, 72px);

    line-height: .95;

    text-transform: uppercase;

    letter-spacing: 1px;

    color: #ffd500;

    text-shadow:
        3px 3px 0 #063d23;

    opacity: 0;

    transform:
        translateY(35px)
        scale(.95);

    animation:
        taskIn 1.2s
        cubic-bezier(.16,1,.3,1)
        1.9s
        forwards;
}


.task .small {

    display: block;

    font-family:
        "DM Mono",
        monospace;

    font-size:
        clamp(10px, 1.2vw, 15px);

    letter-spacing:
        3px;

    color:
        #fff;

    margin-bottom:
        12px;

    text-shadow:
        none;
}


@keyframes taskIn {

    from {
        opacity: 0;

        transform:
            translateY(35px)
            scale(.95);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =====================================================
   ENTER BUTTON
===================================================== */

.enter {

    pointer-events: auto;

    margin-top: 32px;

    padding:
        13px 38px;

    border:
        2px solid #ffd500;

    background:
        #ffd500;

    color:
        #075c32;

    font-family:
        "DM Mono",
        monospace;

    font-size:
        13px;

    font-weight:
        600;

    letter-spacing:
        3px;

    cursor:
        pointer;

    box-shadow:
        5px 5px 0 #062f1c;

    opacity: 0;

    transform:
        translateY(25px);

    animation:
        buttonIn .9s
        cubic-bezier(.16,1,.3,1)
        2.6s
        forwards;

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}


.enter:hover {

    background:
        #fff;

    transform:
        translate(-3px, -3px);

    box-shadow:
        8px 8px 0 #062f1c;
}


.enter:active {

    transform:
        translate(2px, 2px);

    box-shadow:
        2px 2px 0 #062f1c;
}


@keyframes buttonIn {

    from {
        opacity: 0;

        transform:
            translateY(25px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =====================================================
   ENTERING OVERLAY
===================================================== */

.entering {

    position: fixed;

    inset: 0;

    z-index: 200;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    background:
        #076b3a;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity .8s ease,
        visibility .8s ease;
}


.entering.active {

    opacity: 1;

    visibility: visible;
}


/* =====================================================
   ENTERING TEXT
===================================================== */

.entering-text {

    font-family:
        "Anton",
        Impact,
        sans-serif;

    font-size:
        clamp(55px, 12vw, 150px);

    color:
        #ffd500;

    letter-spacing:
        4px;

    animation:
        enteringPulse 1.4s
        ease-in-out
        infinite;
}


.entering-sub {

    margin-top:
        18px;

    color:
        #fff;

    font-size:
        11px;

    letter-spacing:
        4px;
}


@keyframes enteringPulse {

    0%,
    100% {
        transform:
            scale(1);

        opacity:
            .8;
    }

    50% {
        transform:
            scale(1.04);

        opacity:
            1;
    }
}


/* =====================================================
   LOADING LINE
===================================================== */

.loading {

    width:
        min(260px, 60vw);

    height:
        3px;

    margin-top:
        28px;

    background:
        rgba(255,255,255,.25);

    overflow:
        hidden;
}


.loading::after {

    content: "";

    display: block;

    height: 100%;

    width: 35%;

    background:
        #ffd500;

    animation:
        loading 1.2s
        ease-in-out
        infinite;
}


@keyframes loading {

    from {
        transform:
            translateX(-150%);
    }

    to {
        transform:
            translateX(400%);
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    .top-label {

        top: 18px;
        left: 18px;

        font-size: 10px;
    }


    .top-right {

        top: 18px;
        right: 18px;

        font-size: 9px;

        gap: 8px;
    }


    .content {

        top: 58%;
    }


    .task {

        font-size:
            clamp(28px, 8vw, 50px);

        text-shadow:
            2px 2px 0 #063d23;
    }


    .task .small {

        font-size: 9px;

        letter-spacing: 2px;
    }


    .enter {

        margin-top:
            25px;

        padding:
            12px 30px;

        font-size:
            11px;
    }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            0.01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            0.01ms !important;
    }
}

</style>
</head>


<body>


<!-- =================================================
     MAIN SCENE
================================================= -->

<div class="scene">


    <!-- Layer 1 -->
    <img
        src="assets/layer1.png"
        class="layer layer1"
        alt=""
    >


    <!-- Layer 2 -->
    <img
        src="assets/layer2.png"
        class="layer layer2"
        alt=""
    >


    <!-- Layer 3 -->
    <img
        src="assets/layer3.png"
        class="layer layer3"
        alt=""
    >


    <!-- Layer 4 -->
    <img
        src="assets/layer4.png"
        class="layer layer4"
        alt=""
    >


    <!-- Layer 5 -->
    <img
        src="assets/layer5.png"
        class="layer layer5"
        alt=""
    >


    <!-- Layer 6 -->
    <img
        src="assets/layer6.png"
        class="layer layer6"
        alt=""
    >


    <!-- =================================================
         TOP
    ================================================= -->

    <div class="top-label">
        HACKER HOUSE <span>GOA</span> • 2026
    </div>


    <div class="top-right">

        <span>TASK 2</span>

        <div class="dot"></div>

        <span>VOICE AI</span>

    </div>


    <!-- =================================================
         CENTER / BOTTOM CONTENT
    ================================================= -->

    <div class="content">

        <div class="task">

            <span class="small">
                TASK 2 • PROTOTYPE
            </span>

            VOICE-ENABLED<br>
            RAG MODEL

        </div>


        <button
            class="enter"
            id="enterButton"
        >
            ENTER →
        </button>

    </div>


</div>


<!-- =================================================
     ENTERING SCREEN
================================================= -->

<div
    class="entering"
    id="entering"
>

    <div class="entering-text">
        ENTERING...
    </div>

    <div class="entering-sub">
        HACKER HOUSE GOA • 2026
    </div>

    <div class="loading"></div>

</div>


<script>


/* =====================================================
   SUBTLE PARALLAX
===================================================== */

const layers = [
    {
        element: document.querySelector(".layer2"),
        amount: 2
    },
    {
        element: document.querySelector(".layer3"),
        amount: 4
    },
    {
        element: document.querySelector(".layer4"),
        amount: 6
    },
    {
        element: document.querySelector(".layer5"),
        amount: 7
    },
    {
        element: document.querySelector(".layer6"),
        amount: 10
    }
];


document.addEventListener(
    "mousemove",
    function(event) {

        const x =
            (event.clientX /
            window.innerWidth) - .5;

        const y =
            (event.clientY /
            window.innerHeight) - .5;


        layers.forEach(layer => {

            const moveX =
                x * layer.amount;

            const moveY =
                y * layer.amount;


            layer.element.style.transform =
                `translate(${moveX}px, ${moveY}px)`;

        });

    }
);


/* =====================================================
   ENTER
===================================================== */

const enterButton =
    document.getElementById("enterButton");

const entering =
    document.getElementById("entering");


enterButton.addEventListener(
    "click",
    function() {

        /*
         * Stop interaction.
         */

        enterButton.disabled = true;


        /*
         * Show green entering screen.
         */

        entering.classList.add("active");


        /*
         * ============================================
         * LATER:
         *
         * Replace this section with:
         *
         * window.location.href = "home.html";
         *
         * or your actual prototype URL.
         * ============================================
         */

        setTimeout(
            function() {

                // Navigate to the HHG Voice RAG home page
                window.location.href = "../frontend/index.html";

            },
            1800
        );

    }
);


/* =====================================================
   PREVENT IMAGE DRAGGING
===================================================== */

document.querySelectorAll("img").forEach(
    image => {

        image.addEventListener(
            "dragstart",
            event => event.preventDefault()
        );

    }
);

</script>

</body>
</html>
