services:
  - type: web
    name: hh-goa-voice-radar
    env: python
    buildCommand: pip install -r requirements.txt && python -m backend.vector_store.indexer --strategy all
    startCommand: uvicorn backend.api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: true
      - key: SARVAM_API_KEY
        sync: true
